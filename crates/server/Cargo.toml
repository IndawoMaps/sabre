[package]
name = "sabre-server"
version.workspace = true
edition.workspace = true
description = "HTTP tile and zonal-statistics server for Cloud-Optimized GeoTIFFs."
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "sabre-server"
path = "src/main.rs"

[dependencies]
sabre-core = { path = "../core" }
axum = { version = "0.8", default-features = false, features = ["query", "tokio", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
async-trait = "0.1"
# Hashes the caller's provider credential into the geometry cache key, so two
# callers with different access never share an entry and the credential itself
# is not what is held in memory for the life of the cache. See geometry.rs.
sha2 = { version = "0.11", default-features = false }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
pollster = "1.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
