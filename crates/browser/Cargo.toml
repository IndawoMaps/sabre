[package]
name = "sabre-browser"
version.workspace = true
edition.workspace = true
description = "sabre in a browser: COG tiles rendered client-side from fetch range requests."
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sabre-core = { path = "../core" }
async-trait = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Runs the tests in an actual browser. `cargo check --target wasm32` compiles
# code that panics the moment it runs -- that is how the Instant::now() trap
# got in -- so the only test worth having here is one that executes.
wasm-bindgen-test = "0.3"
# Only the tests hand a Cog a blob: URL; the bundle never needs these.
web-sys = { version = "0.3", features = ["Blob", "Url"] }

[dependencies.web-sys]
version = "0.3"
features = ["Headers", "Request", "RequestInit", "Response", "Window", "Performance"]

# Release settings deliberately live in the workspace root: Cargo ignores
# `[profile.*]` in a member manifest and only warns about it, which is how
# this spike first measured a size-optimised build that was nothing of the
# sort. See the root Cargo.toml.
