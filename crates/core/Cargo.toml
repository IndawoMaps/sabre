[package]
name = "sabre-core"
version.workspace = true
edition.workspace = true
description = "Pure-Rust Cloud-Optimized GeoTIFF reader, tile renderer and zonal statistics engine."
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
byteorder = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
# Oneshot channels to wake readers waiting on a page another is fetching.
# Runtime-agnostic, so the same code waits under tokio and in a browser.
futures-channel = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proj4rs = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
proj4rs = { version = "0.2", default-features = false }

[dev-dependencies]
pollster = "1.0"
serde_urlencoded = "0.7"
futures = { version = "0.3", default-features = false, features = ["executor", "async-await"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "render_bench"
harness = false

[[bench]]
name = "query_bench"
harness = false
