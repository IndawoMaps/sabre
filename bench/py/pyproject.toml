[project]
name = "sabre-py"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "rasterio>=1.3",
  "numpy>=1.26",
  "pyproj>=3.6",
  "shapely>=2.0",
  "Pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sabre_py"]
