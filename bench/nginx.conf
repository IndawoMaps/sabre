# The shared origin both servers read the COG from.
#
# nginx answers HTTP range requests for static files out of the box. Every
# request is logged in a fixed format that run.py parses to count how many
# range requests and bytes each server pulled from the origin:
#
#   <unix time> <method> "<uri>" <status> <bytes sent> "<Range header>" "<User-Agent>"
#
# The same directory is served under two prefixes so the log tells the two
# servers apart by path alone: sabre is pointed at /sabre/<file> and titiler
# at /titiler/<file>.

log_format bench '$msec $request_method "$request_uri" $status $body_bytes_sent "$http_range" "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/bench/access.log bench;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  300s;
    keepalive_requests 1000000;
    open_file_cache    max=64 inactive=1h;

    location /sabre/   { alias /data/; }
    location /titiler/ { alias /data/; }
    location = /healthz { return 200 "ok\n"; }
}
