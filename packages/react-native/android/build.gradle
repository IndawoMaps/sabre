plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.sabremaps'
version = '0.0.1' // x-release-please-version

android {
  namespace "com.sabremaps.mobile"
  defaultConfig {
    versionCode 1
    versionName "0.0.1" // x-release-please-version
  }
  // libsabre_mobile.so for each ABI lands in src/main/jniLibs, built by
  // `just rn-android` from crates/mobile. Shipped in the npm package, not the repo.
}
