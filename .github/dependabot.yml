# Dependency updates, merged without a human when CI passes -- see
# .github/workflows/dependabot.yml for which ones.
#
# Commit prefixes are conventional commits, so each update lands in the right
# place in the changelog: a bump to something that ships is `fix(deps)` and
# earns a patch release; tooling, CI and dev dependencies are `chore`/`ci`
# and stay out of the changelog.
#
# Minor and patch updates come grouped, one PR per ecosystem per week. Majors
# come one at a time, since those are the ones that need reading.

version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # The peer range in @sabremaps/ol is a promise to users; moving it is a
      # decision, not a bump. The pinned dev copy follows it by hand.
      - dependency-name: ol
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        update-types: [minor, patch]
