# Cuts releases, and publishes the images a benchmark box pulls.
#
# Every push to main runs release-please, which keeps a release PR open with
# the next version and its changelog, worked out from the conventional-commit
# PR titles merged since the last release. Merging that PR is the release: this
# same run then tags it, writes the GitHub release, attaches the binaries and
# publishes the npm packages. Nothing else cuts a release -- a hand-pushed tag
# would skip the changelog and leave the manifest behind.
#
# The benchmark used to compile sabre-server and bench-client on the droplets
# themselves, which was ten to twenty minutes of a box that lives for an hour.
# It also meant the thing under test was built by whatever toolchain the box
# happened to have. Both problems go away if CI builds once and the box pulls.
#
# Images are tagged by commit SHA as well as by branch. Benchmarks should pin
# the SHA: it makes the image the provenance, so a result is tied to a commit
# whether or not the box that produced it had a git checkout.

name: release

on:
  push:
    branches: [main]
  # Run by hand, as an ordinary run, or with `tag` to stage a release that is
  # already tagged on npm again -- when its npm job failed, say. A re-run of
  # the failed job would use the workflow as it was at that release, mistake
  # and all; this uses the workflow as it is now, on that release's code:
  #
  #   gh workflow run release.yml -f tag=v0.1.0
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to stage on npm again, e.g. v0.1.0. Empty for an ordinary run.
        required: false
        default: ''

env:
  REGISTRY: ghcr.io

concurrency:
  group: release-${{ github.ref }}
  # Not cancelled: a run that has just tagged a release still has binaries and
  # npm to publish, and a push landing behind it must not cut that short. A
  # newer push still replaces any run that is only queued.
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Optional. With the default token the release PR runs no CI, since
      # GitHub doesn't start workflows for events its own token causes. A
      # GitHub App's token does. See CONTRIBUTING.md#releases.
      - id: app
        if: vars.RELEASE_BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    name: images
    needs: release-please
    # Not when re-staging an old release: that would tag main's image as it.
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - target: server
            image: sabre-server
          - target: bench-client
            image: sabre-bench-client

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # The release's tag isn't the ref this ran for -- the run is a push
          # to main -- so the semver tags take their value explicitly.
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }},enable=${{ needs.release-please.outputs.created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }},enable=${{ needs.release-please.outputs.created == 'true' }}
          # Only a release is `latest`. A benchmark that pulled `latest` from
          # main would silently change what it measures.
          flavor: latest=${{ needs.release-please.outputs.created == 'true' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          # DigitalOcean droplets are amd64. Adding arm64 would roughly double
          # the build for an image nothing pulls.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shared across both matrix legs: same compile, same cache.
          cache-from: type=gha,scope=sabre-build
          cache-to: type=gha,scope=sabre-build,mode=max

  binaries:
    name: binaries
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release -p sabre-server -p sabre-cli -p sabre-bench-client

      - name: Collect
        run: |
          mkdir -p dist
          for b in sabre-server sabre bench-client; do
            install -m 0755 "target/release/$b" "dist/$b-linux-amd64"
          done
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -l dist

      # Onto the release release-please just wrote, leaving its notes alone.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" dist/* --clobber

  ios:
    name: iOS library
    needs: release-please
    if: needs.release-please.outputs.created == 'true' || inputs.tag != ''
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build sabre-mobile as SabreFFI.xcframework
        # As `just rn-ios`.
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=sabre --remap-path-prefix=/Users/runner=~
          CFLAGS: -ffile-prefix-map=${{ github.workspace }}=sabre -ffile-prefix-map=/Users/runner=~
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo rustc -p sabre-mobile --release --target $target --crate-type staticlib
          done
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libsabre_mobile.a -headers crates/mobile/include \
            -library target/aarch64-apple-ios-sim/release/libsabre_mobile.a -headers crates/mobile/include \
            -output packages/react-native/ios/SabreFFI.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: sabre-ffi-xcframework
          path: packages/react-native/ios/SabreFFI.xcframework
          if-no-files-found: error

  npm:
    name: npm stage
    needs: [release-please, ios]
    if: needs.release-please.outputs.created == 'true' || inputs.tag != ''
    runs-on: ubuntu-latest
    # Named in each package's trusted publisher on npmjs.com: the OIDC token
    # carries it, and npm refuses a token from any other environment. The name
    # has to match that setting exactly.
    environment: Publish
    permissions:
      contents: read
      # npm trusted publishing: the registry takes this workflow's OIDC token in
      # place of a stored NPM_TOKEN. Each package names this repo and
      # release.yml as its trusted publisher on npmjs.com.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      # A tag given by hand has to be a release, and the code checked out has
      # to be that release's: staging 0.1.1's code as 0.1.0 would be worse
      # than not staging at all.
      - name: Check the tag is this release
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a release tag"; exit 1; }
          for p in browser ol react-native; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "v$v" = "$TAG" ] || { echo "::error::packages/$p is $v, not $TAG"; exit 1; }
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli,cargo-ndk
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      # 24 for its npm 11: trusted publishing needs 11.5.1 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # `npm stage` arrived in 11.15. Node 24 bundles a newer npm today, but a
      # cached older 24.x would fail the publish on a missing command.
      - run: npm install -g npm@^11.15.0 && npm --version

      - name: Build the wasm into @sabremaps/browser
        # As `just npm`: rewrite embedded source paths, which name the runner's
        # home directory otherwise.
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=sabre --remap-path-prefix=/home/runner=~
        run: |
          cargo build -p sabre-browser --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir packages/browser/wasm --no-typescript \
            target/wasm32-unknown-unknown/release/sabre_browser.wasm

      - name: Build sabre-mobile into @sabremaps/react-native
        # As `just rn-android`, keeping only sabre's own library.
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=sabre --remap-path-prefix=/home/runner=~
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 \
            -o packages/react-native/android/src/main/jniLibs build -p sabre-mobile --release
          find packages/react-native/android/src/main/jniLibs -name '*.so' ! -name libsabre_mobile.so -delete

      - uses: actions/download-artifact@v8
        with:
          name: sabre-ffi-xcframework
          path: packages/react-native/ios/SabreFFI.xcframework

      - run: pnpm install --frozen-lockfile

      # pnpm packs, since it rewrites @sabremaps/ol's `workspace:^` into the
      # version being released; npm publishes, since it speaks OIDC.
      #
      # Staged, not published: each package's trusted publisher allows only
      # `npm stage publish`, so nothing reaches the registry until a maintainer
      # approves it with 2FA (`npm stage list`, then `npm stage approve <id>`,
      # or on npmjs.com). A compromised workflow can stage, but not release.
      # Approve @sabremaps/browser before @sabremaps/ol, which depends on it.
      - name: Stage
        run: |
          mkdir -p dist
          for p in browser ol react-native; do
            (cd packages/$p && pnpm pack --pack-destination ../../dist)
          done
          tar tzf dist/sabremaps-browser-*.tgz | grep -q wasm/sabre_browser_bg.wasm
          test "$(tar tzf dist/sabremaps-react-native-*.tgz | grep -c 'libsabre_mobile\.so$')" = 4
          test "$(tar tzf dist/sabremaps-react-native-*.tgz | grep -c 'SabreFFI\.xcframework/.*/libsabre_mobile\.a$')" = 2
          # ./ is not optional: npm reads `dist/x.tgz` as the GitHub repo
          # dist/x.tgz, which is how the 0.0.2 release failed to publish.
          npm stage publish ./dist/sabremaps-browser-*.tgz --access public
          npm stage publish ./dist/sabremaps-ol-*.tgz --access public
          npm stage publish ./dist/sabremaps-react-native-*.tgz --access public
