# PRs are squash-merged with their title as the commit subject, so the title
# is what release-please reads: `feat:` is a minor release, `fix:` a patch,
# `feat!:` or a `BREAKING CHANGE:` footer a major (a minor, while we're 0.x).
# The commits inside a PR can say whatever they like.

name: pr title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: conventional commit
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
          requireScope: false
