name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the run for the old one pointless, so it is
# cancelled. Runs on main are grouped by commit instead, so none is ever
# cancelled: each is the only check of what that merge produced.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  browser:
    name: browser (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      # The point of this job. `cargo check --target wasm32` compiles code that
      # panics the moment it runs -- std::time::Instant::now() does exactly
      # that -- so the browser target is only meaningfully covered by tests
      # that execute. Reintroducing that bug fails this step and nothing else.
      #
      # webdriver.json names the Chrome that setup-chrome installed. Without
      # it chromedriver takes the runner's preinstalled /opt/google/chrome,
      # which is a different major version, and refuses the session:
      # "This version of ChromeDriver only supports Chrome version 154 /
      # Current browser version is 152".
      #
      # It goes in the package directory, not the workspace root: that is
      # where wasm-bindgen-test-runner looks, and putting it anywhere else
      # gets a quiet "Not found" and the wrong Chrome.
      - name: Test in headless Chrome
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cat > crates/browser/webdriver.json <<JSON
          {
            "goog:chromeOptions": {
              "binary": "${{ steps.chrome.outputs.chrome-path }}",
              "args": ["--headless=new", "--no-sandbox", "--disable-dev-shm-usage"]
            }
          }
          JSON
          "$CHROMEDRIVER" --version
          "${{ steps.chrome.outputs.chrome-path }}" --version
          cargo test -p sabre-browser --target wasm32-unknown-unknown

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Advisory for now — see CONTRIBUTING.md. Not yet gated on -D warnings.
      - run: cargo clippy --workspace --all-targets


  docker:
    name: docker image
    # PRs only. On main, release.yml builds and pushes the same Dockerfile, so
    # a check here would be the same build a second time.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The Dockerfile copies the workspace in pieces, so a member outside
      # crates/ that isn't added there breaks the image while every cargo job here
      # passes. Without this job that surfaced only in `release`, after merge.
      # The default target is enough: its build stage compiles both binaries.
      # Reads release's cache but never writes it, so a PR can't evict main's.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=sabre-build

  npm:
    name: npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Build the wasm into @sabremaps/browser
        # As `just npm`: rewrite embedded source paths, which name the runner's
        # home directory otherwise.
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=sabre --remap-path-prefix=/home/runner=~
        run: |
          cargo build -p sabre-browser --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir packages/browser/wasm --no-typescript \
            target/wasm32-unknown-unknown/release/sabre_browser.wasm

      # Measured here, on the release build the package ships: the size numbers
      # only mean anything with LTO applied, and a member manifest's
      # [profile.release] is silently ignored, so this is also what proves the
      # workspace-root profile is the one in effect.
      - name: Report bundle size
        run: |
          raw=$(stat -c%s packages/browser/wasm/sabre_browser_bg.wasm)
          br=$(brotli -q 11 -c packages/browser/wasm/sabre_browser_bg.wasm | wc -c)
          printf '| | bytes | \n| --- | --- |\n| wasm | %s |\n| brotli | %s |\n' \
            "$(numfmt --grouping $raw)" "$(numfmt --grouping $br)" >> "$GITHUB_STEP_SUMMARY"
          # A budget rather than a target: the client path stops being worth it
          # if the decoder costs more than the imagery. Raise it deliberately.
          limit=$((300 * 1024))
          if [ "$br" -gt "$limit" ]; then
            echo "::error::brotli bundle is $br bytes, over the $limit budget"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # The example imports @sabremaps/ol, so this is the check that a bundler
      # still finds the worker and the wasm inside the packages.
      - name: Bundle the example
        working-directory: examples/openlayers
        run: |
          pnpm exec vite build
          ls dist/assets | grep -q '\.wasm$'
          ls dist/assets | grep -q '^worker-'
      - name: Pack
        run: |
          mkdir -p dist
          for p in browser ol; do (cd packages/$p && pnpm pack --pack-destination ../../dist); done
          tar tzf dist/sabremaps-browser-*.tgz | grep -q wasm/sabre_browser_bg.wasm
          tar tzf dist/sabremaps-browser-*.tgz | grep -q LICENSE.md

  react-native-ios:
    name: react-native package (iOS library)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build sabre-mobile as SabreFFI.xcframework
        # As `just rn-ios`.
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=sabre --remap-path-prefix=/Users/runner=~
          CFLAGS: -ffile-prefix-map=${{ github.workspace }}=sabre -ffile-prefix-map=/Users/runner=~
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo rustc -p sabre-mobile --release --target $target --crate-type staticlib
          done
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libsabre_mobile.a -headers crates/mobile/include \
            -library target/aarch64-apple-ios-sim/release/libsabre_mobile.a -headers crates/mobile/include \
            -output packages/react-native/ios/SabreFFI.xcframework
      - name: Check it is machine code exporting the C ABI
        # Bitcode from Rust's LLVM would reach here fine and fail in the app's link.
        run: |
          for slice in ios-arm64 ios-arm64-simulator; do
            test "$(xcrun nm -gU packages/react-native/ios/SabreFFI.xcframework/$slice/libsabre_mobile.a 2>/dev/null \
              | grep -cE ' _sabre_(start|stop|string_free)$')" = 3
          done
      - uses: actions/upload-artifact@v7
        with:
          name: sabre-ffi-xcframework
          path: packages/react-native/ios/SabreFFI.xcframework
          if-no-files-found: error

  react-native:
    name: react-native package
    needs: react-native-ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Point cargo-ndk at the NDK the runner ships
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build sabre-mobile for every Android ABI
        # As `just rn-android`.
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=sabre --remap-path-prefix=/home/runner=~
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 \
            -o packages/react-native/android/src/main/jniLibs build -p sabre-mobile --release
          find packages/react-native/android/src/main/jniLibs -name '*.so' ! -name libsabre_mobile.so -delete
      - uses: actions/download-artifact@v4
        with:
          name: sabre-ffi-xcframework
          path: packages/react-native/ios/SabreFFI.xcframework
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the package and typecheck the example against it
        run: |
          pnpm --filter @sabremaps/react-native build
          (cd examples/react-native && pnpm exec tsc --noEmit)
      - name: Pack
        run: |
          mkdir -p dist
          (cd packages/react-native && pnpm pack --pack-destination ../../dist)
          tar tzf dist/sabremaps-react-native-*.tgz > contents
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -q "jniLibs/$abi/libsabre_mobile.so" contents
          done
          grep -q build/index.js contents
          grep -q app.plugin.js contents
          grep -q LICENSE.md contents
          # Only sabre's library: a dependency's stray cdylib would ship in every app.
          test "$(grep -c '\.so$' contents)" = 4
          # The podspec vendors the framework; one without the other breaks pod install.
          grep -q ios/Sabre.podspec contents
          grep -q ios/SabreModule.swift contents
          for slice in ios-arm64 ios-arm64-simulator; do
            grep -q "SabreFFI.xcframework/$slice/libsabre_mobile.a" contents
            grep -q "SabreFFI.xcframework/$slice/Headers/module.modulemap" contents
          done
      # The tarball exactly as a release would publish it, for trying it in an
      # app, or for publishing by hand the first time (see CONTRIBUTING.md).
      - uses: actions/upload-artifact@v7
        with:
          name: sabremaps-react-native
          path: dist/sabremaps-react-native-*.tgz
          if-no-files-found: error
